name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # lib/ is gitignored: rebuild it from public Mojang/Forge/Maven
      # artifacts (vanilla jars + mappings + universal + lwjgl/authlib),
      # then fuse + AT + stubs into lib/merged-srg-forge.jar.
      - name: Fetch compile deps
        run: ./tool/fetch-deps.sh

      - name: Build mod jar
        run: ./gradlew build --no-daemon

      - name: Verify artifact
        run: |
          ls -lh build/libs/
          unzip -l build/libs/myau-*.jar | head -n 8
          python3 -c "import zipfile; z = zipfile.ZipFile('build/libs/myau-1.0.0.jar'); assert 'Skid.class' in z.namelist(), 'Skid missing'; print('entries:', len(z.namelist()))"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/myau-1.0.0.jar
          generate_release_notes: true

      # Manual runs have no tag, so ship the jar as a run artifact instead.
      - name: Upload jar artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: myau-1.0.0
          path: build/libs/myau-1.0.0.jar
